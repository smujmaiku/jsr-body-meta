name: check

on:
  push:
    branches: ['**']
  # Never pull_request_target: forks expose secrets
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Name is required by branch protection
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - name: Install dependencies
        run: deno install --frozen
      - name: fmt, lint, test
        run: deno task check
